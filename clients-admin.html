<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Clients Admin</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#111;--surface2:#181818;--border:#222;--orange:#FF8C33;--text:#e0e0e0;--muted:#666;--red:#ff4444;--green:#2DD512}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,textarea,select{font-family:inherit;font-size:14px}
button{cursor:pointer}

.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50}
.brand{font-family:'Courier New',monospace;font-size:11px;letter-spacing:3px;color:var(--orange);text-transform:uppercase}
.topbar-actions{display:flex;gap:10px;align-items:center}
.status{font-family:'Courier New',monospace;font-size:10px;color:var(--muted)}

.btn{height:36px;padding:0 18px;border-radius:18px;border:none;background:var(--orange);color:#000;font-weight:700;font-size:13px;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--orange);color:var(--orange);opacity:1}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{height:30px;padding:0 14px;font-size:12px;border-radius:15px}

.wrap{max-width:760px;margin:0 auto;padding:32px 20px}
h1{font-size:18px;font-weight:700;margin-bottom:14px}
h2{font-size:16px;font-weight:700;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}

.list{margin-top:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
.row .slug{font-family:'SF Mono',Menlo,monospace;font-size:13px;color:var(--orange);min-width:120px}
.row .name{flex:1;color:var(--text);font-size:14px}
.row .actions{display:flex;gap:6px}
.row a{color:var(--muted);font-size:12px;text-decoration:none;border:1px solid var(--border);padding:6px 10px;border-radius:14px;transition:all .15s}
.row a:hover{color:var(--orange);border-color:var(--orange)}
.empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label{font-family:'Courier New',monospace;font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
input,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 14px;outline:none;transition:border-color .2s;width:100%}
input:focus,textarea:focus{border-color:var(--orange)}
textarea{resize:vertical;min-height:240px;line-height:1.55;font-family:'SF Mono',Menlo,monospace;font-size:13px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:760px;position:relative}
.modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{border-color:var(--orange);color:var(--orange)}

.gate{padding:18px 0}
.gate-msg{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.err{font-size:13px;color:var(--red);margin-top:10px;min-height:18px}

.form-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.form-actions .right{display:flex;gap:8px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;font-size:13px;z-index:200;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">CLIENTS — ADMIN</span>
  <div class="topbar-actions">
    <span class="status" id="status"></span>
    <button class="btn ghost sm" onclick="openTokenGate()">Token</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div>
      <h1>Client proposals</h1>
      <p class="muted">Each entry is encrypted with its own passcode. Saving here commits clients.json to GitHub.</p>
    </div>
    <button class="btn" onclick="openEditor(null)">+ New</button>
  </div>
  <div class="list" id="list"></div>
</div>

<!-- Token gate -->
<div class="modal" id="token-modal" hidden>
  <div class="modal-card">
    <button class="modal-close" onclick="closeTokenGate()">×</button>
    <h2>GitHub token</h2>
    <p class="muted" style="margin-bottom:14px">Paste a personal access token with <code>repo</code> scope. Stored only in your browser's localStorage.</p>
    <div class="field"><label>Token</label><input id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxx"></div>
    <div class="form-actions">
      <span></span>
      <button class="btn" onclick="saveToken()">Connect</button>
    </div>
  </div>
</div>

<!-- Editor / passcode gate -->
<div class="modal" id="editor-modal" hidden>
  <div class="modal-card">
    <button class="modal-close" onclick="closeEditor()">×</button>
    <h2 id="editor-title">Edit proposal</h2>

    <div id="passcode-step" class="gate" hidden>
      <p class="gate-msg">Enter the passcode for <strong id="ps-slug"></strong> to unlock and edit.</p>
      <div class="field"><label>Passcode</label><input id="ps-input" type="password" autofocus></div>
      <div class="form-actions">
        <button class="btn danger sm" onclick="deleteEntry()">Delete this proposal</button>
        <div class="right"><button class="btn" onclick="unlockEntry()">Unlock</button></div>
      </div>
      <div class="err" id="ps-err"></div>
    </div>

    <form id="ed-form" hidden onsubmit="event.preventDefault();saveEntry()">
      <div class="field-row">
        <div class="field"><label>Slug (URL)</label><input id="ed-slug" required></div>
        <div class="field"><label>Passcode (set or change)</label><input id="ed-pw" type="text" placeholder="leave blank to keep"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Client name</label><input id="ed-client"></div>
        <div class="field"><label>Browser title</label><input id="ed-title"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Stripe link</label><input id="ed-stripe" placeholder="https://buy.stripe.com/..."></div>
        <div class="field"><label>Pay button label</label><input id="ed-paylabel" placeholder="Pay deposit | $2,900"></div>
      </div>
      <div class="field"><label>Body (markdown, GFM tables)</label><textarea id="ed-body" rows="22"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn danger sm" onclick="deleteEntry()">Delete</button>
        <div class="right">
          <button type="button" class="btn ghost" onclick="closeEditor()">Cancel</button>
          <button type="submit" class="btn" id="ed-save">Save & commit</button>
        </div>
      </div>
      <div class="err" id="ed-err"></div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const REPO = 'nicomaggioli/nm-site-';
const FILE = 'clients.json';
const BASE = 'https://api.github.com';

let token = localStorage.getItem('clients-admin-token') || '';
let allData = {};
let fileSha = '';
let editingSlug = null;
let unlockedPw = null;

const $ = id => document.getElementById(id);
const status = msg => { $('status').textContent = msg || ''; };
const toast = (msg, kind='ok') => {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + kind;
  setTimeout(() => { t.className = 'toast ' + kind; }, 2200);
};

// ── crypto ──
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, usage){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, [usage]);
}
async function decrypt(p, pw){
  const salt = b64d(p.salt), iv = b64d(p.iv), ct = b64d(p.ct);
  const key = await deriveKey(pw, salt, 'decrypt');
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
async function encrypt(payload, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, 'encrypt');
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(payload)));
  return {salt:b64e(salt), iv:b64e(iv), ct:b64e(ct)};
}

// ── GitHub API ──
async function ghAPI(method, path, body){
  const r = await fetch(`${BASE}/repos/${REPO}/${path}`, {
    method,
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || r.statusText); }
  return r.json();
}

async function loadFile(){
  if (!token) { openTokenGate(); return; }
  status('Loading…');
  try {
    const data = await ghAPI('GET', `contents/${FILE}`);
    fileSha = data.sha;
    allData = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g,'')))));
    renderList();
    $('app').hidden = false;
    status(`Loaded ${Object.keys(allData).length} proposals`);
  } catch(e) {
    status('Error: ' + e.message);
    if (/credentials|Not Found|Bad/i.test(e.message)) { openTokenGate(); }
    else toast('Load failed: ' + e.message, 'err');
  }
}

async function saveFile(message){
  status('Saving…');
  const json = JSON.stringify(allData, null, 2) + '\n';
  const content = btoa(unescape(encodeURIComponent(json)));
  const data = await ghAPI('PUT', `contents/${FILE}`, { message, content, sha: fileSha });
  fileSha = data.content.sha;
  status('Saved ✓');
}

// ── token ──
function openTokenGate(){ $('token-input').value = token; $('token-modal').hidden = false; }
function closeTokenGate(){ $('token-modal').hidden = true; }
function saveToken(){
  token = $('token-input').value.trim();
  localStorage.setItem('clients-admin-token', token);
  closeTokenGate();
  loadFile();
}

// ── list ──
function renderList(){
  const list = $('list');
  list.innerHTML = '';
  const slugs = Object.keys(allData).sort();
  if (!slugs.length) {
    list.innerHTML = '<div class="empty">No proposals yet. Click + New to add one.</div>';
    return;
  }
  slugs.forEach(slug => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="slug">${slug}</span>
      <span class="name muted">encrypted</span>
      <div class="actions">
        <a href="/clients/${slug}" target="_blank">view</a>
        <button class="btn ghost sm" data-edit="${slug}">edit</button>
      </div>`;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditor(b.dataset.edit)));
}

// ── editor ──
function openEditor(slug){
  editingSlug = slug;
  unlockedPw = null;
  $('ed-err').textContent = '';
  $('ps-err').textContent = '';
  $('editor-title').textContent = slug ? `Edit "${slug}"` : 'New proposal';
  $('editor-modal').hidden = false;

  if (slug) {
    $('passcode-step').hidden = false;
    $('ed-form').hidden = true;
    $('ps-slug').textContent = slug;
    $('ps-input').value = '';
    setTimeout(() => $('ps-input').focus(), 50);
  } else {
    $('passcode-step').hidden = true;
    $('ed-form').hidden = false;
    fillForm({});
    setTimeout(() => $('ed-slug').focus(), 50);
  }
}

function closeEditor(){
  $('editor-modal').hidden = true;
  editingSlug = null;
  unlockedPw = null;
}

async function unlockEntry(){
  const pw = $('ps-input').value;
  $('ps-err').textContent = '';
  try {
    const payload = await decrypt(allData[editingSlug], pw);
    unlockedPw = pw;
    $('passcode-step').hidden = true;
    $('ed-form').hidden = false;
    fillForm(payload);
  } catch {
    $('ps-err').textContent = 'Wrong passcode.';
  }
}

function fillForm(p){
  $('ed-slug').value = editingSlug || '';
  $('ed-pw').value = '';
  $('ed-pw').placeholder = editingSlug ? 'leave blank to keep current passcode' : 'set a passcode';
  $('ed-client').value = p.client || '';
  $('ed-title').value = p.title || '';
  $('ed-stripe').value = p.stripeLink || '';
  $('ed-paylabel').value = p.payLabel || '';
  $('ed-body').value = p.body || '';
}

async function saveEntry(){
  const slug = $('ed-slug').value.trim();
  const newPw = $('ed-pw').value;
  $('ed-err').textContent = '';

  if (!slug) { $('ed-err').textContent = 'Slug is required.'; return; }
  if (!editingSlug && !newPw) { $('ed-err').textContent = 'Passcode is required for new proposals.'; return; }

  const pw = newPw || unlockedPw;
  if (!pw) { $('ed-err').textContent = 'No passcode available — re-enter the passcode field.'; return; }

  const payload = {
    client: $('ed-client').value.trim(),
    title: $('ed-title').value.trim(),
    body: $('ed-body').value,
    stripeLink: $('ed-stripe').value.trim(),
    payLabel: $('ed-paylabel').value.trim(),
  };

  $('ed-save').disabled = true;
  try {
    const enc = await encrypt(payload, pw);
    if (editingSlug && editingSlug !== slug) delete allData[editingSlug];
    allData[slug] = enc;
    await saveFile(editingSlug ? `Update proposal: ${slug}` : `Add proposal: ${slug}`);
    renderList();
    toast('Saved ✓');
    closeEditor();
  } catch(e) {
    $('ed-err').textContent = 'Save failed: ' + e.message;
    toast('Save failed', 'err');
  } finally {
    $('ed-save').disabled = false;
  }
}

async function deleteEntry(){
  if (!editingSlug) { closeEditor(); return; }
  if (!confirm(`Delete proposal "${editingSlug}"? This cannot be undone.`)) return;
  try {
    delete allData[editingSlug];
    await saveFile(`Delete proposal: ${editingSlug}`);
    renderList();
    toast('Deleted');
    closeEditor();
  } catch(e) {
    toast('Delete failed: ' + e.message, 'err');
  }
}

loadFile();
</script>
</body>
</html>
