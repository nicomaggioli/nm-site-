<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html{background:#0a0a0a}
  body{background:#0a0a0a;color:#fff;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  /* header, nav and orbs all come from /css/nm-header.css, which the homepage
     loads too — that shared file is what keeps the two bars identical. The
     blurred, bordered, sticky bar that used to be here was the main reason
     this page felt like a different site. */
  
  p{text-wrap:pretty}
  /* Full bleed. The horizontal padding is gone entirely so the tiles run to
   both screen edges at every width, matching the homepage grid. Vertical
   padding stays: the top clears the fixed header, the bottom separates the
   footer. column-gap is 0 and .tile has no margin, so the columns meet. */
  .grid{columns:2;column-gap:0;padding:max(clamp(96px,9vw,132px),6.875vw) 0 max(clamp(60px,9vw,120px),6.25vw)}
        /* Explicit counts. `columns:<count> <width>` treats the count as a MAX --
           used = min(4, floor(width/260)) -- so 768px resolved to 2 columns of
           384px, wider tiles than a 1440 desktop gets, and the page came out
           38,623px tall. Three columns did not arrive until 780px and four not
           until 1040px, which also meant landscape phones got LONGER on rotate. */
        /* 3 from 600, not 768: a landscape phone (667px) sat on 2 columns of 334px
           -- larger tiles than a 1440 desktop, and a 33,566px page. Rotating the
           phone made the page 75% LONGER. 600 puts that band on 222px tiles. */
        @media(min-width:600px){.grid{columns:3}}
        /* 4 at 1024, not 1280: at three columns a 1024 viewport gives 341px tiles --
           the largest on the site, and a 23,200px page, taller than either the
           768 or the 1280 view. Four columns puts 1024 on 256px tiles, matching
           768's, and the height curve stops having a bump in the middle. */
        @media(min-width:1024px){.grid{columns:4}}
        @media(min-width:1600px){.grid{columns:5}}
  
  footer{padding:0 max(clamp(12px, 7.8px + 1.07vw, 24px), 1.25vw);border-top:0;color:rgba(255,255,255,.6)}
        /* Matched to the homepage footer rather than being its own design: a
           dashed hairline, the copyright on the left and the email on the
           right, on ONE row at every width. The old version was a 277px block
           with its own CTA ("Let's make your vision", which the homepage no
           longer says) stacked above a second meta row. */
        .foot-rule{height:.5px;width:100%;
          background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0px,rgba(255,255,255,.5) 3px,transparent 3px,transparent 6px);
          background-size:100% .5px;background-repeat:no-repeat;background-position:bottom}
        /* Geist Sans and font-weight:400, matching the homepage footer exactly.
           In the mono the email set 201px wide against 163px here, which at
           375px no longer fit on one line with the copyright. */
        /* Every value read off the homepage footer rather than guessed:
           letter-spacing:normal (not .16em -- the tracking made the email 205px
           against 163px, so at 375px it no longer shared a line with the
           copyright), line-height:1.1 => 13.2px, and 24px 0 on the inner row,
           which is what makes both footers exactly 61px tall. */
        .foot-bar{display:flex;align-items:center;justify-content:space-between;gap:max(16px,0.8333vw);
          padding:max(24px,1.25vw) 0;font-size:max(12px,0.625vw);line-height:1.1;letter-spacing:normal;
          text-transform:uppercase;font-family:'Geist',system-ui,sans-serif;font-weight:400}
        .foot-copy{color:rgba(255,255,255,.62)}
        /* The homepage closes on a centred call to action; this page closed on a
       utility bar, so navigating between them changed the ending. Same copy,
       same treatment, same fluid size curve. */
    .foot-cta{text-align:center;padding:clamp(56px,7vw,120px) 0 clamp(24px,3vw,48px)}
    .foot-cta p{margin:0;font-family:'Geist',system-ui,sans-serif;font-weight:700;
      text-transform:uppercase;letter-spacing:-.02em;line-height:1.08;color:#fff;
      font-size:max(min(54px, 6.2vw), 2.8125vw);white-space:nowrap}
    .foot-cta a{color:inherit;text-decoration:underline;text-underline-offset:.12em;
      white-space:nowrap;transition:color .2s ease}
    @media (hover:hover){.foot-cta a:hover{color:var(--nm-orange, #FF7820)}}
    .foot-cta a:focus-visible{outline:2px solid #fff;outline-offset:3px}
    /* was #fff with a hover that DIMMED it -- backwards, and brighter than the
       homepage's 62% equivalent */
    .foot-mail{color:rgba(255,255,255,.62);text-decoration:none;text-align:right;
      /* 13px of text is not a tap target; padding grows it and the negative
         margin keeps the bar exactly the same height */
      padding:15px 0;margin:-15px 0;transition:color .2s ease}
        .foot-mail:hover{color:#fff}
        .tile{break-inside:avoid;margin:0;overflow:hidden;background:#141414;border-radius:0}
  .tile img{display:block;width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.3,1),opacity .4s}
  .tile:hover img{transform:scale(1.035)}
  @media(max-width:640px){}
  @media(prefers-reduced-motion:reduce){.tile img{transition:none}}
</style>
