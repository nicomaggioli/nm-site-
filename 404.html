<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<script>
(function(){
  var p = window.location.pathname;
  var m = p.match(/^\/clients\/([^/?#]+)\/?$/);
  if (m) {
    window.location.replace('/clients.html?c=' + encodeURIComponent(m[1]) + window.location.hash);
    return;
  }
  // Default GitHub Pages SPA fallback
  window.location.replace('/' + '?p=' + p.slice(1));
})();
</script>
</head>
<body></body>
</html>
