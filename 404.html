<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Page not found — Nico Maggioli</title>
<link rel="icon" href="/icon.svg?nm1" sizes="any" type="image/svg+xml">
<style>
@font-face{font-family:Geist;src:url('/fonts/geist-sans-var.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html{background:#0a0a0a;color:#f5f5f5}
body{margin:0;font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #ff7820;outline-offset:6px}
header{padding:24px clamp(20px,4vw,80px)}
.wordmark{display:inline-flex;align-items:center;min-height:44px;font-size:18px;font-weight:650;letter-spacing:-.04em}
main{width:min(100%,1040px);padding:clamp(64px,12vh,160px) clamp(20px,4vw,80px) 80px}
.label{margin:0 0 24px;color:#ff7820;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
h1{margin:0;font-size:clamp(48px,8vw,112px);font-weight:650;letter-spacing:-.06em;line-height:1.02;text-wrap:balance}
.copy{max-width:36ch;margin:30px 0;color:#aaa;font-size:clamp(18px,2vw,24px)}
nav{display:flex;flex-wrap:wrap;gap:20px 32px;margin-top:36px}
nav a{display:inline-flex;align-items:center;min-height:44px;border-bottom:1px solid #777;font-size:18px}
nav a:hover{color:#ff7820;border-color:#ff7820}
</style>
<script>
/* GitHub Pages keeps the HTTP 404 status for missing paths. Preserve the
   existing private proposal links; every other path stays a not-found page. */
(function () {
  var m = location.pathname.match(/^\/clients\/([^/?#]+)\/?$/);
  if (m && m[1].toLowerCase() !== 'admin.html') {
    location.replace('/clients/?c=' + encodeURIComponent(m[1]) + location.hash);
  }
})();
</script>
</head>
<body>
<header><a class="wordmark" href="/" aria-label="Nico Maggioli — Home">NICO MAGGIOLI</a></header>
<main>
  <p class="label">404 / Page not found</p>
  <h1>Nothing here.<br>Plenty to explore.</h1>
  <p class="copy">This page may have moved, or the address may be incorrect. Explore my work or learn more about me.</p>
  <nav aria-label="Explore the portfolio"><a href="/">Home</a><a href="/index/">Work index</a><a href="/about/">About</a></nav>
</main>
</body>
</html>
